spring:
  application:
    name: scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: http://localhost:5173
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}